# Deploys the API Worker (`api/`) when something under it changes on `main`. It needs two repository secrets, set by the owner:
# CLOUDFLARE_API_TOKEN (permission: Workers Scripts edit) and CLOUDFLARE_ACCOUNT_ID. Without them the job says so and stops, so
# the workflow is safe to merge before the Cloudflare side exists. Database migrations are NOT applied here (README, "Backend").
name: Deploy API

on:
  push:
    branches: [main]
    paths: ['api/**', 'package.json', 'package-lock.json', 'scripts/version.ts', 'scripts/print-version.ts']
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy the Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set: not deploying the API."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.secrets.outputs.ready == 'true'
      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler deploy --config api/wrangler.toml --var "APP_VERSION:$(node --experimental-strip-types scripts/print-version.ts)"
