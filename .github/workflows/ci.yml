# Full test suite, run every night on main and on demand (Actions tab -> CI -> Run workflow, pick a branch).
# Pull requests run no GitHub Actions: the Cloudflare Pages Git integration builds the preview deploy by itself.
#
# The checks run as parallel jobs (unit tests, lint, build, and the end-to-end tests in one job (nightly, so speed matters less than setup cost)). The last job, `test`, waits
# for all of them and keeps its name.
name: CI

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC every night, on the default branch
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    name: Type-check, build, bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:bundle

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The offline spec tests the built app, so the job builds it (about ten seconds).
      - run: npm run build
      # The browser depends only on Playwright's version, so key the cache on that, not on the whole lockfile
      # (any dependency change used to miss the cache and download Chromium again on every run).
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright's browser
        id: browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Playwright Chromium
        if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.browser.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: E2E (desktop + emulated phone)
        run: npx playwright test
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
          if-no-files-found: ignore

  test:
    name: test
    if: always()
    needs: [unit, lint, build, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: |
          echo "unit=${{ needs.unit.result }} lint=${{ needs.lint.result }} build=${{ needs.build.result }} e2e=${{ needs.e2e.result }}"
          test "${{ needs.unit.result }}" = success -a "${{ needs.lint.result }}" = success -a "${{ needs.build.result }}" = success -a "${{ needs.e2e.result }}" = success
