# Full test suite: on every pull request (any base branch, so stacked PRs are checked too), every night on main, and on demand
# (Actions tab -> CI -> Run workflow, pick a branch). A merge to main does not run it again: the PR was checked, and the nightly run
# catches anything that slipped through. The Cloudflare Pages Git integration builds the preview deploy by itself.
#
# The checks run as parallel jobs (unit tests, lint, build, and the end-to-end tests in four shards). The last job, `test`, waits
# for all of them and keeps its name, so it can be the one required check.
name: CI

on:
  pull_request:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC every night, on the default branch
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    name: Type-check, build, bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:bundle

  wasm:
    name: WebAssembly engine is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # rustup (on the runner) installs the toolchain that engine-rs/rust-toolchain.toml names, on the first cargo call.
      - run: npm run build:wasm -- --check

  # The browser is cached by this job alone, before the shards start. When every shard tried to fill the cache at once, some
  # missed and downloaded Chromium while others hit, and the cache could end up holding a half-installed browser.
  browser:
    name: Playwright browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      key: ${{ steps.playwright.outputs.key }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browser depends only on Playwright's version, so the key is that (no restore-keys: an older version's browser is no use).
      - name: Playwright version
        id: playwright
        run: echo "key=playwright-${{ runner.os }}-$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright's browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright.outputs.key }}
      # Downloads only on a cache miss; on a hit it finds the browser and does nothing.
      - run: npx playwright install chromium

  e2e:
    name: E2E ${{ matrix.shard }}
    needs: browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The offline spec tests the built app, so every shard builds it (about ten seconds).
      - run: npm run build
      - name: Restore Playwright's browser
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ needs.browser.outputs.key }}
          fail-on-cache-miss: true
      # The browser comes from the cache; the system libraries it needs are not part of it.
      - run: npx playwright install-deps chromium
      - name: E2E (desktop + emulated phone), shard ${{ matrix.shard }}
        run: npx playwright test --shard=${{ matrix.shard }}
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results-${{ strategy.job-index }}
          path: test-results
          retention-days: 7
          if-no-files-found: ignore

  test:
    name: test
    if: always()
    needs: [unit, lint, build, wasm, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: |
          echo "unit=${{ needs.unit.result }} lint=${{ needs.lint.result }} build=${{ needs.build.result }} wasm=${{ needs.wasm.result }} e2e=${{ needs.e2e.result }}"
          test "${{ needs.unit.result }}" = success -a "${{ needs.lint.result }}" = success -a "${{ needs.build.result }}" = success -a "${{ needs.wasm.result }}" = success -a "${{ needs.e2e.result }}" = success
