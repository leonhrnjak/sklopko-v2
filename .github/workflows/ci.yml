# Full test suite: on every pull request (any base branch, so stacked PRs are checked too), every night on main, and on demand
# (Actions tab -> CI -> Run workflow, pick a branch). A merge to main does not run it again: the PR was checked, and the nightly run
# catches anything that slipped through. The Cloudflare Pages Git integration builds the preview deploy by itself.
#
# The checks run as parallel jobs (unit tests, lint, build, and the end-to-end tests in four shards). The last job, `test`, waits
# for all of them and keeps its name, so it can be the one required check. A PR that changes only documentation skips the checks
# (the `changes` job decides), and `test` still passes.
name: CI

on:
  pull_request:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC every night, on the default branch
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request that changes only documentation (docs/, *.md, LICENSE) skips the real checks. The jobs are skipped, not removed,
  # so the `test` job still reports and can stay the one required check. The nightly run and a manual run always run everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      # A pull request is checked out as a merge commit: its first parent is the base, so HEAD^1..HEAD is exactly the PR's change.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "$files"
          if echo "$files" | grep -qvE '^(docs/.*|.*\.md|LICENSE)$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only documentation changed: the code checks are skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  unit:
    name: Unit tests
    needs: [changes, wasm]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Use the engine this run built
        uses: actions/download-artifact@v7
        with:
          name: engine-wasm
          path: src/engine/wasm
      - run: npm test

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    name: Type-check, build, bundle budget
    needs: [changes, wasm]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Use the engine this run built
        uses: actions/download-artifact@v7
        with:
          name: engine-wasm
          path: src/engine/wasm
      - run: npm run build
      - run: npm run check:bundle
      # The e2e shards test this build instead of each making its own.
      - name: Keep the build for the e2e shards
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist
          retention-days: 1
          if-no-files-found: error

  # Builds the Rust engine. The unit and build jobs below use this build instead of the committed file, so a PR that changes
  # engine-rs/ is tested with what its source builds to. On a pull request from this repository, if the committed file differs the
  # job also commits the new one to the PR branch (Cloudflare's Git build has no Rust and uses the committed file). A push made with
  # the workflow's own token does not start another run: this run already tested the new file. On the nightly run and on a fork's
  # pull request nothing is pushed, and a stale file fails the job.
  wasm:
    name: WebAssembly engine is up to date
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # rustup (on the runner) installs the toolchain that engine-rs/rust-toolchain.toml names, on the first cargo call.
      - run: npm run build:wasm
      - name: Keep the built engine for the other jobs
        uses: actions/upload-artifact@v6
        with:
          name: engine-wasm
          path: src/engine/wasm/engine.wasm
          retention-days: 1
          if-no-files-found: error
      - name: Commit the engine if it changed
        run: |
          if git diff --quiet -- src/engine/wasm/engine.wasm; then
            echo "src/engine/wasm/engine.wasm is up to date."
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/engine/wasm/engine.wasm
            git commit -m "Rebuild src/engine/wasm/engine.wasm from engine-rs/"
            git push origin "HEAD:${{ github.head_ref }}"
          else
            echo "src/engine/wasm/engine.wasm is not what engine-rs/ builds to. Run 'npm run build:wasm' and commit the result."
            exit 1
          fi

  # The browser is cached by this job alone, before the shards start. When every shard tried to fill the cache at once, some
  # missed and downloaded Chromium while others hit, and the cache could end up holding a half-installed browser.
  browser:
    name: Playwright browser
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      key: ${{ steps.playwright.outputs.key }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browser depends only on Playwright's version, so the key is that (no restore-keys: an older version's browser is no use).
      - name: Playwright version
        id: playwright
        run: echo "key=playwright-${{ runner.os }}-$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright's browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright.outputs.key }}
      # Downloads only on a cache miss; on a hit it finds the browser and does nothing.
      - run: npx playwright install chromium

  e2e:
    name: E2E ${{ matrix.shard }}
    needs: [changes, browser, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The offline spec tests the built app: take the build job's output instead of building again in every shard.
      - name: Get the build
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - name: Restore Playwright's browser
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ needs.browser.outputs.key }}
          fail-on-cache-miss: true
      # The browser comes from the cache; the system libraries it needs are not part of it.
      - run: npx playwright install-deps chromium
      - name: E2E (desktop + emulated phone), shard ${{ matrix.shard }}
        run: npx playwright test --shard=${{ matrix.shard }}
      # Also after a run that passed only on a retry: the trace of the first failure is in test-results.
      - name: Upload Playwright results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results-${{ strategy.job-index }}
          path: test-results
          retention-days: 7
          if-no-files-found: ignore

  test:
    name: test
    if: always()
    needs: [changes, unit, lint, build, wasm, browser, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: |
          echo "code changed: ${{ needs.changes.outputs.code }}"
          echo "changes=${{ needs.changes.result }} unit=${{ needs.unit.result }} lint=${{ needs.lint.result }} build=${{ needs.build.result }} wasm=${{ needs.wasm.result }} browser=${{ needs.browser.result }} e2e=${{ needs.e2e.result }}"
          test "${{ needs.changes.result }}" = success || exit 1
          # Documentation only: every code check is skipped, and that is the pass. Otherwise every one must have succeeded.
          if [ "${{ needs.changes.outputs.code }}" = "false" ]; then
            want=skipped
          else
            want=success
          fi
          for r in "${{ needs.unit.result }}" "${{ needs.lint.result }}" "${{ needs.build.result }}" "${{ needs.wasm.result }}" "${{ needs.browser.result }}" "${{ needs.e2e.result }}"; do
            test "$r" = "$want" || exit 1
          done
