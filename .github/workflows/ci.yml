# Full test suite for every pull request. Merging to main deploys to Cloudflare Pages.
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Type-check and build
        run: npm run build
      - name: Bundle budget
        run: npm run check:bundle
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E (desktop + emulated phone)
        run: npm run e2e
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
          if-no-files-found: ignore
